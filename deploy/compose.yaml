# 大肥鱼 · 云端部署编排（AstrBot + NapCat）
# 用法：把 deploy/ 下的文件放到服务器 /opt/dafeiyu/，按需修改路径与账号后
#       docker compose up -d
services:
  astrbot:
    build: .
    image: dafeiyu-astrbot:latest
    container_name: astrbot
    restart: unless-stopped
    ports:
      # 默认只绑本机，远程访问走 SSH 隧道：
      #   ssh -L 6185:127.0.0.1:6185 root@<服务器>   然后开 http://127.0.0.1:6185
      # 确需公网直连再改回 "6185:6185"（并配安全组、改强密码）
      - "127.0.0.1:6185:6185"  # AstrBot 面板
    volumes:
      - /opt/dafeiyu/astrbot/data:/AstrBot/data
      # 核心补丁用 bind-mount 接入：升级镜像不会覆盖（见 docs/踩坑合集）
      - /opt/dafeiyu/patches/dashscope_tts.py:/AstrBot/astrbot/core/provider/sources/dashscope_tts.py:ro
      - /opt/dafeiyu/patches/stage.py:/AstrBot/astrbot/core/pipeline/result_decorate/stage.py:ro
      - /opt/dafeiyu/patches/respond_stage.py:/AstrBot/astrbot/core/pipeline/respond/stage.py:ro
      - /opt/dafeiyu/patches/chat_layout.py:/AstrBot/astrbot/core/pipeline/chat_layout.py:ro
    environment:
      - TZ=Asia/Shanghai

  napcat:
    # 钉版：已验证组合（桌面端 NapCat 4.18.38；Docker 镜像发布滞后一版，取 v4.18.37）
    image: mlikiowa/napcat-docker:v4.18.37
    container_name: napcat
    restart: unless-stopped
    ports:
      - "127.0.0.1:6099:6099"  # NapCat WebUI（默认仅本机；SSH 隧道访问，公网改法同上）
    volumes:
      - /opt/dafeiyu/napcat/config:/app/napcat/config
      - /opt/dafeiyu/napcat/qq:/app/.config/QQ
    environment:
      - TZ=Asia/Shanghai
      - ACCOUNT=your_qq_account            # Docker 入口脚本用 -q 快速登录（不是 NAPCAT_ACCOUNT）
      - NAPCAT_QUICK_ACCOUNT=your_qq_account  # Worker 重启后自动尝试快速登录
